site_name: rustpool
site_description: A parallel RL environment-execution engine in Rust, with state forks for search and factored action masks.
repo_url: https://github.com/wiremind/rustpool
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            heading_level: 3
            show_root_heading: true
            show_signature_annotations: true
            merge_init_into_class: true
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - The pool, threads and dispatch: concepts/pool.md
      - Episodes and auto-reset: concepts/autoreset.md
      - Factored action masks: concepts/factored-actions.md
      - State forks for search: concepts/mcts.md
      - The JAX bridge: concepts/jax-bridge.md
      - PyTorch: concepts/pytorch.md
      - gymnasium: concepts/gymnasium.md
  - Guides:
      - Write an environment inside rustpool: guides/env-in-rustpool.md
      - Bring your own crate: guides/own-crate.md
      - Training with JAX and PyTorch: guides/training.md
  - Environments: environments.md
  - Reference:
      - Python API: api.md
      - Rust API: rust-api.md
      - Changelog: changelog.md
