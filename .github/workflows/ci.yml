name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          components: rustfmt, clippy  # what rust-toolchain.toml lists, installed up front
      - run: cargo fmt --check
      - run: cargo test --all
      - name: Clippy (advisory)
        run: cargo clippy --all-targets
        continue-on-error: true

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      JAX_PLATFORMS: cpu
      RUSTPOOL_REQUIRE_OPTIONAL: "1"  # a missing jax/torch/gymnasium/cargo fails, not skips
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          components: rustfmt, clippy  # what rust-toolchain.toml lists, installed up front
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build extension + install test deps
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip maturin
          # examples + dev extras (jax/flax/optax/mctx, torch, gymnasium, pytest, ruff).
          ./.venv/bin/maturin develop --extras examples,dev
      - name: Pytest
        run: ./.venv/bin/pytest -q
      - name: Ruff
        run: ./.venv/bin/ruff check .

  docs:
    # Builds the documentation site only; nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          components: rustfmt, clippy  # what rust-toolchain.toml lists, installed up front
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Build extension + docs tooling
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip maturin
          # The API page reads the compiled module's docstrings, so install the extension.
          ./.venv/bin/maturin develop --release --extras docs
      - name: mkdocs build --strict
        run: ./.venv/bin/mkdocs build --strict --site-dir site
