[package]
name = "_rustpool"
version = "0.1.8"
edition = "2021"
rust-version = "1.88"
description = "Pure-Rust parallel RL environment-execution engine (EnvPool-style) with a state-cloning MCTS substrate, exposed to Python via PyO3."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/wiremind/rustpool"
keywords = ["reinforcement-learning", "envpool", "mcts", "simulation", "pyo3"]
categories = ["science", "simulation", "concurrency"]
# Distributed as a Python package (PyPI) and, for external env crates, as a git dependency.
publish = false

[lib]
name = "_rustpool"
crate-type = ["cdylib", "rlib"] # Critical for creating a Python extension module and linking

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "macros"] }
numpy = "0.29"
crossbeam-channel = "0.5"
rand = "0.10.3"
once_cell = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pythonize = "0.29"
rayon = "1.10"

# The docs' "Bring your own crate" guide, compiled as a real extension module (cargo test
# builds it; tests/test_external_crate.py imports it).
[[example]]
name = "external_env"
path = "examples/rust/external_env.rs"
crate-type = ["cdylib"]
